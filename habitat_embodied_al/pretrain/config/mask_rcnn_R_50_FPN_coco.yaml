# Training overlay for pretrain/ (see repo-root CLAUDE.md's Running things), HSSD-HAB variant:
# COCO-pretrained Mask R-CNN R-50 FPN, box-only head (MASK_ON: False -- flip to True to train
# on the real per-pixel masks ObjectDetectorGTSensor/coco_writer.py produce).
# MODEL.ROI_HEADS.NUM_CLASSES is set at runtime by pretrain.py from the registered dataset's
# thing_classes (17, per ds_hssd.yaml's filter_classes).
_BASE_: "Base-RCNN-FPN.yaml"
MODEL:
  WEIGHTS: "detectron2://COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl"
  MASK_ON: False
  RESNETS:
    DEPTH: 50
