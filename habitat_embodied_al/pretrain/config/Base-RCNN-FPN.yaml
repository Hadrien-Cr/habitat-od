# Local copy of detectron2's own configs/Base-RCNN-FPN.yaml, content unmodified except
# DATASETS.TRAIN/TEST (repointed at the fixed "train"/"val" names
# habitat_embodied_al.dataset.register_dataset always uses -- see pretrain.py's --ds-config
# mode) and the added TEST.EVAL_PERIOD. Copied rather than _BASE_-referenced from
# third_party/detectron2/configs/ so this package's model configs (mask_rcnn_R_50_FPN_coco*.yaml
# etc.) don't depend on the vendored detectron2 clone's file layout -- any overlay can point
# _BASE_ at this file the same way the originals point at theirs. reproduce/config/ keeps its
# own duplicate of this file instead of pointing _BASE_ here, so it stays self-contained too.
MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  BACKBONE:
    NAME: "build_resnet_fpn_backbone"
  RESNETS:
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  ANCHOR_GENERATOR:
    SIZES: [[32], [64], [128], [256], [512]]  # One size for each in feature map
    ASPECT_RATIOS: [[0.5, 1.0, 2.0]]  # Three aspect ratios (same for all in feature maps)
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]
    PRE_NMS_TOPK_TRAIN: 2000  # Per FPN level
    PRE_NMS_TOPK_TEST: 1000  # Per FPN level
    POST_NMS_TOPK_TRAIN: 1000
    POST_NMS_TOPK_TEST: 1000
  ROI_HEADS:
    NAME: "StandardROIHeads"
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    POOLER_RESOLUTION: 7
  ROI_MASK_HEAD:
    NAME: "MaskRCNNConvUpsampleHead"
    NUM_CONV: 4
    POOLER_RESOLUTION: 14
DATASETS:
  TRAIN: ("train",)
  TEST: ("val",)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.001
  STEPS: (7000, 9000)
  MAX_ITER: 10000
  CHECKPOINT_PERIOD: 2000
INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
TEST:
  EVAL_PERIOD: 2000
VERSION: 2
