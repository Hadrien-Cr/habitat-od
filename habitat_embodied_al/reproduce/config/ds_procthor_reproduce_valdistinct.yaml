# Distinct validation-set collection config for reproduce/ (see ../README.md) --
# the counterpart of the original repo's validation_data_create.py. Draws from
# ProcTHOR-hab's own held-out ProcTHOR-Val-* scene pool (never touched by
# ds_procthor_reproduce.yaml's train/val scenes, which only use ProcTHOR-Train-*),
# same as the original repo drawing PROCTHOR_VAL_SCENES (HousePlan81-90) from
# prior's separate "val" split rather than just holding out more train scenes.
#
# train_scenes is intentionally omitted -- this only ever produces a val.json/val/
# under datasets/procthor_reproduce_valdistinct/, meant purely to score an already
# fine-tuned checkpoint against, not to train further. No trainer_name: collected via
# collect_validation (collection.py), not a habitat-baselines trainer. Consume with:
#   PYTHONPATH=. python habitat_embodied_al/collect_validation_dataset.py \
#       --config habitat_embodied_al/reproduce/config/ds_procthor_reproduce_valdistinct.yaml
run_name: procthor_reproduce_valdistinct
steps_per_episode: 1000
filter_empty: False

object_params:
  env_name: "ProcTHOR-hab"
  vocab_name: "ProcTHOR-native"
  min_area_fraction: 0.001
  filter_low_visibility: True
  min_mesh_visibility_fraction: 0.2
  # kept identical to ds_procthor_reproduce.yaml's filter_classes so both
  # datasets share the exact same 49-class category space.
  filter_classes: [
    "apple", "tomato", "bread", "pot", "knife", "fork", "spoon", "bowl", "egg", "lettuce",
    "potato", "mug", "plate", "cup", "butter knife", "statue", "tissue box", "laptop",
    "remote control", "box", "newspaper", "key chain", "cell phone", "credit card", "candle",
    "plunger", "toilet paper", "soap bottle", "spray bottle", "book", "alarm clock", "pen",
    "pencil", "watch", "baseball bat", "basket ball", "bottle", "dish sponge", "paper towel roll",
    "pepper shaker", "salt shaker", "spatula", "teddy bear", "tennis racket", "vase", "pillow",
    "desk lamp", "cd", "wine bottle" ]

val_scenes: [
  "ProcTHOR-Val-0", "ProcTHOR-Val-1", "ProcTHOR-Val-2", "ProcTHOR-Val-3", "ProcTHOR-Val-4",
  "ProcTHOR-Val-5", "ProcTHOR-Val-6", "ProcTHOR-Val-7", "ProcTHOR-Val-8", "ProcTHOR-Val-9",
]
