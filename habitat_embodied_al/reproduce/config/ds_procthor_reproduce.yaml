# Pretraining (train+val) collection config for reproduce/ (see ../README.md).
# 80 ProcTHOR-hab train-pool scenes (ProcTHOR-Train-0..79), split 64/16 -- same
# scene count and split ratio as the original embodied-active-learning-od repo's
# pretraining_data_create.py --scene-type procthor (PROCTHOR_TRAIN_SCENES, 80
# scenes, 80/20 split). Consume with:
#   PYTHONPATH=. python habitat_embodied_al/collect_dataset.py \
#       --config habitat_embodied_al/reproduce/config/ds_procthor_reproduce.yaml
run_name: procthor_reproduce
steps_per_episode: 500
filter_empty: False

object_params:
  env_name: "ProcTHOR-hab"
  vocab_name: "ProcTHOR-native"
  area_thr: 1000
  filter_low_visibility: True
  min_visibility_fraction: 0.15
  # classes.py::PROCTHOR_SHORT_CLASSES -- the 49-class shortlist reproduced from
  # the original repo's OBJECTS_PROCTHOR_SHORT.
  filter_classes: [
    "Apple", "Tomato", "Bread", "Pot", "Knife", "Fork", "Spoon", "Bowl", "Egg", "Lettuce",
    "Potato", "Mug", "Plate", "Cup", "ButterKnife", "Statue", "TissueBox", "Laptop",
    "RemoteControl", "Box", "Newspaper", "KeyChain", "CellPhone", "CreditCard", "Candle",
    "Plunger", "ToiletPaper", "SoapBottle", "SprayBottle", "Book", "AlarmClock", "Pen",
    "Pencil", "Watch", "BaseballBat", "BasketBall", "Bottle", "DishSponge", "PaperTowelRoll",
    "PepperShaker", "SaltShaker", "Spatula", "TeddyBear", "TennisRacket", "Vase", "Pillow",
    "DeskLamp", "CD", "WineBottle" ]

train_scenes: [
  "ProcTHOR-Train-0", "ProcTHOR-Train-1", "ProcTHOR-Train-2", "ProcTHOR-Train-3", "ProcTHOR-Train-4",
  "ProcTHOR-Train-5", "ProcTHOR-Train-6", "ProcTHOR-Train-7", "ProcTHOR-Train-8", "ProcTHOR-Train-9",
