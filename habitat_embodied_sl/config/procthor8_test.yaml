# Test config for habitat_embodied_sl/collect_test.py (see ../README.md): collects each test scene straight into the test
# set <dataset_root>/<run_name>/test/, and saves itself as <dataset_root>/<run_name>/config.yaml, which every scene of the
# set shares. Collected one collect_test.py call per scene: ProcTHOR-Val-0 to -15, procthor8's test set.
run_name: procthor8_test
dataset_root: datasets  # relative to the repo root scripts run from
seed: 0
input_image_size: 1024  # side of the rendered frames

object_params:
  env_name: "ProcTHOR-hab"
  vocab_name: "PROCTHOR100"
  min_area_fraction: 5e-4
  filter_low_visibility: True
  min_mesh_visibility_fraction: 0.2
  filter_classes: []

frontier_agent:
  visibility_dist_m: 3.0
  steps: 1000

frame_stride: 5  # the frames kept: every frame_stride-th step's
