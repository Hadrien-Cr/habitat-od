# Collection config for habitat_embodied_sl/collect_test.py (see ../README.md): records each test scene under
# <raw_root>/<run_name>/<scene>/. Its scenes: ProcTHOR-Val-0 to -15, procthor8's test set, datasets/procthor8_test/,
# written by an earlier collect_test.py straight into that COCO test set, without a raw record.
run_name: procthor8_test
raw_root: raw  # relative to the repo root scripts run from, like the build's dataset_root
seed: 0
input_image_size: 1024  # side of the rendered frames

object_params:
  env_name: "ProcTHOR-hab"
  vocab_name: "PROCTHOR100"
  min_area_fraction: 5e-4
  filter_low_visibility: True
  min_mesh_visibility_fraction: 0.2
  filter_classes: []

frontier_agent:
  visibility_dist_m: 3.0
  steps: 1000

frame_stride: 5  # the frames kept: every frame_stride-th step's
