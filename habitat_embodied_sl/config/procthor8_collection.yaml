# Collection config for habitat_embodied_sl/collect.py (see ../README.md): writes datasets/<run_name>/<variant>/.
# Collected one collect.py call per scene (../README.md, Running): the first 8 ProcTHOR-Train houses of 2 to 3 rooms
# (counted from their stage's room names), ProcTHOR-Train-5, -6, -9, -11, -14, -26, -30 and -32, into the train sets,
# ProcTHOR-Val-0 to -7 into the test set.
run_name: procthor_medium
seed: 0

object_params:
  env_name: "ProcTHOR-hab"
  vocab_name: "PROCTHOR100"
  min_area_fraction: 5e-4
  filter_low_visibility: True
  min_mesh_visibility_fraction: 0.2
  filter_classes: []

collection:
  steps_per_scene: 1000
  k_retrieval: 10

evaluation:
  frames_per_scene: 50
  downsampling: 4

frontier_agent:
  visibility_dist_m: 3.0
  steps: 1000
