# Collection config for habitat_embodied_sl/collect.py (see ../README.md): writes datasets/<run_name>/<variant>/.
# collection_procthor_medium.yaml's settings on its 2-room ProcTHOR-Train-5 house alone, for quick checks of the pipeline.
run_name: procthor_small
seed: 0

object_params:
  env_name: "ProcTHOR-hab"
  vocab_name: "PROCTHOR100"
  min_area_fraction: 5e-4
  filter_low_visibility: True
  min_mesh_visibility_fraction: 0.2
  filter_classes: []

collection:
  steps_per_scene: 1000
  k_retrieval: 10
  scenes: ["ProcTHOR-Train-5"]

evaluation:
  frames_per_scene: 50
  downsampling: 4
  scenes: []

frontier_agent:
  visibility_dist_m: 3.0
  steps: 1000
