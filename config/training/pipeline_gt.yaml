# @package _group_
batch_size: 8
n_iterations: 1
loss_margin: 0.3
thr: 0
exp_base_name: pipeline_gt
exp_name_training: ground_truth_sgd
lr: 0.0001
optimizer: SGD
optimizer_params:
  momentum: 0.9
  nesterov: True

transform_type: strong_image
teacher_momentum: 0.99
temperature: 2

pipeline: Pipeline
student_model: MultiStageModel
pseudo_labeler_method: vanilla
alpha: 0.7
loss_weights:
  loss_rpn_cls: 1.0
  loss_rpn_loc: 1.0
  loss_box_reg: 1.0
  loss_cls: 1.0
  contrastive_loss: 0.0
  loss_mask: 0.0

weight_sampler: False
update_target: True
reinit_online: False
use_gt: True